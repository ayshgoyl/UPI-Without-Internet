databases:
  - name: offline-upi-db
    plan: free
    databaseName: offline_upi
    user: offline_upi

services:
  # Public entry point — serves frontend + proxies API (same origin, no CORS)
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: USER_SERVICE_HOSTPORT
        fromService:
          type: web
          name: user-account-service
          property: hostport
      - key: PAYMENT_SERVICE_HOSTPORT
        fromService:
          type: web
          name: payment-transaction-service
          property: hostport
      - key: WALLET_SERVICE_HOSTPORT
        fromService:
          type: web
          name: wallet-balance-service
          property: hostport
      - key: QR_SERVICE_HOSTPORT
        fromService:
          type: web
          name: qr-payment-service
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: offline-upi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: offline-upi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: offline-upi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: offline-upi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: offline-upi-db
          property: password
      - key: DB_SSLMODE
        value: disable

  - type: web
    name: user-account-service
    runtime: docker
    dockerfilePath: ./user-account-service/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: offline-upi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: offline-upi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: offline-upi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: offline-upi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: offline-upi-db
          property: password
      - key: DB_SSLMODE
        value: disable

  - type: web
    name: payment-transaction-service
    runtime: docker
    dockerfilePath: ./payment-transaction-service/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: offline-upi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: offline-upi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: offline-upi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: offline-upi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: offline-upi-db
          property: password
      - key: DB_SSLMODE
        value: disable

  - type: web
    name: wallet-balance-service
    runtime: docker
    dockerfilePath: ./wallet-balance-service/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: offline-upi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: offline-upi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: offline-upi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: offline-upi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: offline-upi-db
          property: password
      - key: DB_SSLMODE
        value: disable

  - type: web
    name: qr-payment-service
    runtime: docker
    dockerfilePath: ./qr-payment-service/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: SSL_ENABLED
        value: "false"
      - key: DB_HOST
        fromDatabase:
          name: offline-upi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: offline-upi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: offline-upi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: offline-upi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: offline-upi-db
          property: password
      - key: DB_SSLMODE
        value: disable
